# Active Limit.less API. Supply an existing PostgreSQL database and web origin.
services:
  - type: web
    name: limitless-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /ready
    dockerCommand: sh -c 'cd /app/apps/api && python -m alembic upgrade head && exec python -m uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8000}'
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEMO_MODE
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: VAULT_KEY
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: ADZUNA_APP_ID
        sync: false
      - key: ADZUNA_APP_KEY
        sync: false
      - key: ADZUNA_DAILY_CALL_LIMIT
        value: "15"
