name: Verified application
on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: python -m pip install -r apps/api/requirements-dev.txt
      - run: npm ci
        working-directory: apps/web
      - name: Runtime lint
        run: python -m ruff check apps/api/app/runtime packages/scoring/journey.py tests/api tests/scoring/test_journey.py
      - name: API and scoring tests
        run: python -m pytest tests -q
      - name: Fresh database migration and schema drift
        env:
          DATABASE_URL: sqlite+aiosqlite:///migration-check.db
        working-directory: apps/api
        run: |
          python -m alembic upgrade head
          python -m alembic check
      - run: npm run lint
        working-directory: apps/web
      - run: npm run type-check
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - name: Workspace, assessment and landing journeys
        run: npm run test:e2e
        working-directory: apps/web
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-test-report
          path: apps/web/playwright-report

